[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mayank Singh Kushwaha", email = "mayanksinghk26@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "boto3>=1.43.105",
    "bs4>=0.0.2",
    "dotenv>=0.9.9",
    "fastapi>=0.142.2",
    "langgraph>=1.2.12",
    "lxml>=6.1.3",
    "mammoth>=1.13.0",
    "markdownify>=1.2.3",
    "numpy>=2.5.3",
    "openai>=3.22.1",
    "pillow>=12.3.0",
    "python-json-logger>=4.2.0",
    "qdrant-client>=1.19.1",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/core",
    "src/create_dataset",
    "src/rag",
    "src/utility"
]
