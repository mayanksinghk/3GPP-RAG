services:
  # ── Vector Database (Qdrant with Disk Persistence) ──────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Persistent named volume preserves all vectors, payloads, and indexes across container restarts
      - qdrant_storage:/qdrant/storage
      - ./exported_snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Local Inference Engine (Embeddings & Flash Planner) ─────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      # Persistent named volume stores model weights permanently on disk
      - ollama_models:/root/.ollama
    # Uncomment if using NVIDIA GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── One-Time Model Provisioner ──────────────────────────────────────────────
 # ── One-Time Model Provisioner ──────────────────────────────────────────────
  model-init:
    image: ollama/ollama:latest
    container_name: rag-model-init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: >
      /bin/sh -c "
      echo 'Checking and pulling required local models...';
      ollama pull nomic-embed-text;
      ollama pull qwen2.5-coder:1.5b;
      ollama pull qwen2.5-coder:7b;
      echo 'Local models verified and cached.';
      "
    restart: "no"

  # ── RAG Pipeline & API Endpoint ─────────────────────────────────────────────
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app
      - /app/.venv
      - ./output_markdowns:/app/output_markdowns
      - uv_cache:/root/.cache/uv
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_started
      model-init:
        condition: service_completed_successfully

# ── AnythingLLM Frontend ────────────────────────────────────────────────────
  anythingllm:
    image: mintplexlabs/anythingllm
    container_name: anythingllm
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - anythingllm_storage:/app/server/storage
    environment:
      - STORAGE_DIR=/app/server/storage
      - LLM_PROVIDER=generic-openai
      - OPENAI_BASE_PATH=http://rag-app:8000/v1
      - OPENAI_API_KEY=sk-dummy-key
      - GENERIC_OPENAI_MODEL_PREF=3gpp-rag-engine
      - GENERIC_OPENAI_MODEL_TOKEN_LIMIT=4096
      - INITIAL_ONBOARDING=false
    depends_on:
      - rag-app

# ── Persistent Storage Definitions ────────────────────────────────────────────
volumes:
  qdrant_storage:
    name: rag_qdrant_storage
  ollama_models:
    name: rag_ollama_models
  uv_cache:
    name: rag_uv_cache
  anythingllm_storage:
    name: rag_anythingllm_storage